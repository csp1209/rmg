<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香港巴士路線紙模擬器 | HK Bus Route Sheet Studio (A4)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons (For Editor UI) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts: Noto Sans TC & Inter for authentic HK Bus Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- html-to-image (SVG ForeignObject renderer - Zero text baseline shift) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <!-- html2canvas (Fallback renderer) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- jsPDF for A4 PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- ==========================================================================
       TOP NAVIGATION BAR
       ========================================================================== -->
  <header id="top-navbar" class="h-14 bg-slate-900/95 border-b border-slate-800 px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-black text-lg shadow-inner border border-emerald-400/40">
        B13
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-sm md:text-base tracking-tight text-white">香港巴士路線紙模擬器</h1>
          <span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium">A4 直立專業版</span>
        </div>
        <p class="text-[11px] text-slate-400 hidden sm:block">支援雙數分段一體化淺色底、多班次平行線圓圈編號、純色底站點及零移位導出</p>
      </div>
    </div>

    <!-- Center Quick Presets & JSON I/O -->
    <div class="flex items-center gap-2">
      <div class="hidden lg:flex items-center bg-slate-800/90 rounded-lg p-1 border border-slate-700/80 text-xs">
        <span class="px-2 text-slate-400"><i class="fa-solid fa-swatchbook mr-1"></i>範本：</span>
        <button onclick="loadPreset('B13')" class="px-2.5 py-1 rounded-md bg-emerald-600/90 hover:bg-emerald-500 text-white font-medium transition">城巴 B13 (原版)</button>
        <button onclick="loadPreset('CTB_CITY')" class="px-2.5 py-1 rounded-md hover:bg-slate-700 text-slate-300 transition">城巴市區藍黃</button>
        <button onclick="loadPreset('KMB_RED')" class="px-2.5 py-1 rounded-md hover:bg-slate-700 text-slate-300 transition">九巴紅線配色</button>
      </div>

      <button onclick="exportConfigJSON()" title="匯出設定檔 JSON" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs flex items-center gap-1.5 transition">
        <i class="fa-solid fa-file-export text-sky-400"></i>
        <span class="hidden md:inline">備份 JSON</span>
      </button>
      <label title="匯入設定檔 JSON" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs flex items-center gap-1.5 cursor-pointer transition">
        <i class="fa-solid fa-file-import text-amber-400"></i>
        <span class="hidden md:inline">載入 JSON</span>
        <input type="file" id="json-import-input" accept=".json" class="hidden" onchange="importConfigJSON(event)" />
      </label>

      <div class="h-5 w-[1px] bg-slate-700 mx-1"></div>

      <!-- Export Buttons -->
      <button onclick="exportA4('png')" id="btn-export-png" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-semibold text-xs flex items-center gap-1.5 shadow-sm transition">
        <i class="fa-solid fa-image"></i>
        <span>導出 PNG</span>
      </button>
      <button onclick="exportA4('pdf')" id="btn-export-pdf" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold text-xs flex items-center gap-1.5 shadow-sm transition">
        <i class="fa-solid fa-file-pdf"></i>
        <span>導出 A4 PDF</span>
      </button>
      <button onclick="window.print()" title="使用瀏覽器原生向量列印 PDF (100% 向量無損)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-print text-purple-400"></i>
        <span class="hidden xl:inline">原生列印</span>
      </button>
    </div>
  </header>

  <!-- ==========================================================================
       MAIN CONTENT: LEFT EDITOR SIDEBAR + RIGHT LIVE A4 WORKSPACE
       ========================================================================== -->
  <div class="flex-1 flex overflow-hidden">

    <!-- LEFT EDITOR SIDEBAR -->
    <aside id="editor-sidebar" class="w-full md:w-[440px] lg:w-[490px] bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-20">
      
      <!-- 4 Sleek Navigation Tabs -->
      <div class="grid grid-cols-4 bg-slate-950/70 p-1.5 gap-1 border-b border-slate-800 text-xs font-semibold shrink-0">
        <button onclick="switchEditorTab('theme')" id="tab-btn-theme" class="py-2 px-1 rounded-lg flex flex-col items-center gap-1 transition bg-emerald-600 text-white shadow">
          <i class="fa-solid fa-palette text-sm"></i>
          <span>1. 佈局</span>
        </button>
        <button onclick="switchEditorTab('stops')" id="tab-btn-stops" class="py-2 px-1 rounded-lg flex flex-col items-center gap-1 transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
          <i class="fa-solid fa-route text-sm"></i>
          <span>2. 路線圖站點</span>
        </button>
        <button onclick="switchEditorTab('info')" id="tab-btn-info" class="py-2 px-1 rounded-lg flex flex-col items-center gap-1 transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
          <i class="fa-solid fa-table-columns text-sm"></i>
          <span>3. 右側資訊欄</span>
        </button>
        <button onclick="switchEditorTab('export')" id="tab-btn-export" class="py-2 px-1 rounded-lg flex flex-col items-center gap-1 transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
          <i class="fa-solid fa-sliders text-sm"></i>
          <span>4. 班次與微調</span>
        </button>
      </div>

      <!-- Scrollable Tab Content Container -->
      <div id="editor-content" class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
        <!-- Populated dynamically by JS -->
      </div>
    </aside>

    <!-- RIGHT WORKSPACE: A4 PORTRAIT PREVIEW -->
    <main id="main-workspace" class="flex-1 bg-slate-950/90 flex flex-col overflow-hidden relative">
      
      <!-- Floating Zoom & Quick Info Bar -->
      <div id="workspace-toolbar" class="h-10 bg-slate-900/80 backdrop-blur border-b border-slate-800/80 px-4 flex items-center justify-between text-xs shrink-0 z-10">
        <div class="flex items-center gap-3 text-slate-400">
          <span><i class="fa-regular fa-file-lines mr-1 text-emerald-400"></i>畫布尺寸：<strong class="text-slate-200">直立 A4 (210mm × 297mm / 794 × 1123 px)</strong></span>
          <span class="hidden xl:inline text-slate-500">| 點擊預覽紙上的站點或右側區塊可快速跳轉編輯</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="adjustZoom(-0.1)" class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center"><i class="fa-solid fa-minus"></i></button>
          <span id="zoom-label" class="w-14 text-center font-mono text-slate-200">85%</span>
          <button onclick="adjustZoom(0.1)" class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>
          <button onclick="fitZoom()" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px]">適應視窗</button>
        </div>
      </div>

      <!-- Scrollable Viewport for A4 Sheet -->
      <div id="preview-viewport" class="flex-1 overflow-auto flex justify-center items-start p-6 md:p-8">
        <div id="a4-scale-wrapper" class="transition-transform duration-150 origin-top">
          <!-- THE ACTUAL A4 SHEET -->
          <div id="a4-sheet">
            <!-- Dynamically rendered by renderA4Sheet() -->
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Custom Application Script -->
  <script src="script.js"></script>
</body>
</html>
